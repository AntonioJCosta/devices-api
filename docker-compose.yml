version: '3.9'

services:
  api:
    build: .
    ports:
      - "3000:3000" # Assuming your API runs on 3000 inside the container
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devices
    ports:
      - "5432:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql/data

volumes: 
  postgres_data:
  pgadmin_data:
