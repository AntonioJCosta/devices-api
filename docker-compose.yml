version: '3.9'

services:
  api:
    build: .
    ports:
      - "3000:3000" # Assuming your API runs on 3000 inside the container
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devices
    ports:
      - "5432:5432"
    volumes: # Added volume for persistence
      - postgres_data:/var/lib/postgresql/data

  pgadmin: # Added pgAdmin service
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com # Change this email
      PGADMIN_DEFAULT_PASSWORD: admin # Change this password
    ports:
      - "5050:80" # Access pgAdmin on http://localhost:5050
    depends_on:
      - db
    volumes: # Added volume for pgAdmin data persistence
      - pgadmin_data:/var/lib/pgadmin

volumes: # Define named volumes
  postgres_data:
  pgadmin_data:
